version: 2

unit_tests:
  # --- agg_borough_flow_monthly: month edges, intra-pair, unresolved sides ----
  - name: borough_flow_counts_share_and_flags
    description: >
      Two months of flows from two origins. The January Manhattan rows show the
      share's denominator as the origin borough's own rows (2 + 1 + 1 = 4) and its
      numerator as the three that end in another borough; the Manhattan-intra row
      counts in the denominator and not the numerator. A trip on 2024-01-31 23:59
      stays in January and one at 2024-02-01 00:00 starts February, a trip at the
      window's end and one before it are both out, and a non-billable trip never
      reaches the table. The Unknown and N/A rows carry their flags.
    model: agg_borough_flow_monthly
    overrides:
      vars:
        report_start: '2024-01-01'
        report_end: '2024-04-01'
    given:
      - input: ref('fct_trip')
        rows:
          - {pickup_zone_key: z-man, dropoff_zone_key: z-bkn, pickup_datetime: '2024-01-05 10:00:00', total_amount: 10.00, is_billable: true}
          - {pickup_zone_key: z-man, dropoff_zone_key: z-qns, pickup_datetime: '2024-01-20 09:00:00', total_amount: 20.00, is_billable: true}
          - {pickup_zone_key: z-man, dropoff_zone_key: z-man, pickup_datetime: '2024-01-31 23:59:00', total_amount: 30.00, is_billable: true}
          - {pickup_zone_key: z-man, dropoff_zone_key: z-bkn, pickup_datetime: '2024-01-06 10:00:00', total_amount: 40.00, is_billable: true}
          - {pickup_zone_key: z-unk, dropoff_zone_key: z-man, pickup_datetime: '2024-02-01 00:00:00', total_amount: 5.00, is_billable: true}
          - {pickup_zone_key: z-man, dropoff_zone_key: z-na, pickup_datetime: '2024-02-10 12:00:00', total_amount: 7.50, is_billable: true}
          - {pickup_zone_key: z-man, dropoff_zone_key: z-man, pickup_datetime: '2024-02-29 23:59:00', total_amount: 12.00, is_billable: true}
          - {pickup_zone_key: z-man, dropoff_zone_key: z-bkn, pickup_datetime: '2024-01-07 10:00:00', total_amount: 99.00, is_billable: false}
          - {pickup_zone_key: z-man, dropoff_zone_key: z-bkn, pickup_datetime: '2024-04-01 00:00:00', total_amount: 50.00, is_billable: true}
          - {pickup_zone_key: z-man, dropoff_zone_key: z-bkn, pickup_datetime: '2023-12-31 23:59:00', total_amount: 50.00, is_billable: true}
      - input: ref('dim_zone')
        rows:
          - {zone_key: z-man, borough_name: Manhattan, is_unresolved_zone: false}
          - {zone_key: z-bkn, borough_name: Brooklyn, is_unresolved_zone: false}
          - {zone_key: z-qns, borough_name: Queens, is_unresolved_zone: false}
          - {zone_key: z-unk, borough_name: Unknown, is_unresolved_zone: true}
          - {zone_key: z-na, borough_name: N/A, is_unresolved_zone: true}
    expect:
      rows:
        - {month_start_date: '2024-01-01', origin_borough: Manhattan, dest_borough: Brooklyn, origin_is_unresolved_borough: false, dest_is_unresolved_borough: false, is_intra_borough: false, trip_count: 2, total_revenue: 50.00, origin_trip_count: 4, origin_cross_borough_trip_count: 3, cross_borough_trip_share: 0.75}
        - {month_start_date: '2024-01-01', origin_borough: Manhattan, dest_borough: Queens, origin_is_unresolved_borough: false, dest_is_unresolved_borough: false, is_intra_borough: false, trip_count: 1, total_revenue: 20.00, origin_trip_count: 4, origin_cross_borough_trip_count: 3, cross_borough_trip_share: 0.75}
        - {month_start_date: '2024-01-01', origin_borough: Manhattan, dest_borough: Manhattan, origin_is_unresolved_borough: false, dest_is_unresolved_borough: false, is_intra_borough: true, trip_count: 1, total_revenue: 30.00, origin_trip_count: 4, origin_cross_borough_trip_count: 3, cross_borough_trip_share: 0.75}
        - {month_start_date: '2024-02-01', origin_borough: Unknown, dest_borough: Manhattan, origin_is_unresolved_borough: true, dest_is_unresolved_borough: false, is_intra_borough: false, trip_count: 1, total_revenue: 5.00, origin_trip_count: 1, origin_cross_borough_trip_count: 1, cross_borough_trip_share: 1.0}
        - {month_start_date: '2024-02-01', origin_borough: Manhattan, dest_borough: N/A, origin_is_unresolved_borough: false, dest_is_unresolved_borough: true, is_intra_borough: false, trip_count: 1, total_revenue: 7.50, origin_trip_count: 2, origin_cross_borough_trip_count: 1, cross_borough_trip_share: 0.5}
        - {month_start_date: '2024-02-01', origin_borough: Manhattan, dest_borough: Manhattan, origin_is_unresolved_borough: false, dest_is_unresolved_borough: false, is_intra_borough: true, trip_count: 1, total_revenue: 12.00, origin_trip_count: 2, origin_cross_borough_trip_count: 1, cross_borough_trip_share: 0.5}
